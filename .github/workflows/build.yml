name: Build NoHidden

on:
  push:
    branches:
      - dev
      - main
permissions:
  contents: read

concurrency:
  group: nohidden-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NoHidden.sln

      - name: Build
        run: dotnet build NoHidden.sln -c Release --no-restore

      - name: Scanner smoke tests
        run: dotnet run --project tests/NoHidden.ScannerSmokeTests/NoHidden.ScannerSmokeTests.csproj -c Release --no-restore

      - name: Validate PowerShell test scripts
        shell: pwsh
        run: |
          $files = @(
            './scripts/New-NoHiddenTestUsb.ps1',
            './scripts/Remove-NoHiddenTestUsb.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate self-contained x64 package
        run: >
          dotnet publish NoHidden/NoHidden.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o artifacts/win-x64

      - name: Validate self-contained x86 package
        run: >
          dotnet publish NoHidden/NoHidden.csproj
          -c Release
          -r win-x86
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o artifacts/win-x86
