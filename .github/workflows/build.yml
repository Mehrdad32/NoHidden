name: Build NoHidden

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NoHidden.sln

      - name: Build
        run: dotnet build NoHidden.sln -c Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish NoHidden/NoHidden.csproj -c Release -r win-x64 --self-contained true --no-restore
